name: refresh stats

# Deliberately no `push` trigger: this job commits the stat SVGs, and a push
# trigger would make it re-run on its own commit.
on:
  schedule:
    - cron: "17 5 * * *"        # once a day, 05:17 UTC
  workflow_dispatch:            # ...and a manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Draw the stat graphics
        env:
          # GITHUB_TOKEN is the Actions-provided token: it covers PUBLIC
          # contributions only. To include private ones, create a classic PAT
          # with the read:user scope, save it as a secret named STATS_TOKEN,
          # and this picks it up automatically (see README "Finish + publish").
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # Self-corrects to whichever account owns the repo, so the username
          # is right even if the DEFAULT_LOGIN constant was never edited.
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit whatever changed
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg hd-*.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh profile graphics"
          git push
